# TxTEmpire Shop — Paper Plugin (ersetzt den Mineflayer-Bot-Account)

shop-api-url: "https://shop.deinedomain.de"
bot-api-key: "change-bot-api-key"

# Spieler zahlen an diesen Account (/pay <name> <betrag>)
payment-recipient: "TxtEmpire"

# Chat-Nachrichten für Zahlungserkennung (EssentialsX u. a.)
detect-chat-payments: true

# /pay-Befehle abfangen (Essentials, Vault-Plugins)
detect-pay-commands: true
