name: TxTShop
version: 1.0.0
main: de.txtempire.shop.TxTShopPlugin
api-version: '1.20'
description: TxTEmpire Shop — Link-Codes & ingame-Zahlungen (Website-API)
author: TxTEmpire
commands:
  shop:
    description: Shop-Befehle (link, status)
    usage: /shop link <code> | /shop status
    aliases: [txshop, txtshop]
permissions:
  txtshop.use:
    description: /shop link und /shop status
    default: true
  txtshop.admin:
    description: /shop reload
    default: op
