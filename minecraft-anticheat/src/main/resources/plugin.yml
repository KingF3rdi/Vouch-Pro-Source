name: HelixAC
version: ${version}
main: de.helix.anticheat.HelixACPlugin
api-version: '1.20'
description: Professional packet and movement anti-cheat with LuckPerms support
author: Helix
softdepend: [LuckPerms]
commands:
  ac:
    description: HelixAC admin commands (logs, ban, ip ban, whitelist)
    usage: /ac <logs|ban|ip|whitelist|reload|info> ...
    aliases: [helixac, anticheat]
permissions:
  ac.bypass:
    description: Completely bypasses all HelixAC checks (no flags, no bans)
    default: false
  ac.whitelist:
    description: Player flags but is never auto-banned (permission whitelist)
    default: false
  ac.ban:
    description: /ac ban and /ac ip ban
    default: op
  ac.admin:
    description: Access to /ac whitelist, reload, info
    default: op
    children:
      ac.ban: true
      ac.banlogs: true
      ac.notify: true
  ac.banlogs:
    description: Access to /ac logs and /ban logs
    default: op
  ac.notify:
    description: Receive live flag notifications in chat
    default: op
