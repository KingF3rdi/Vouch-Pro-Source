name: HelixAC
version: ${version}
main: de.helix.anticheat.HelixACPlugin
api-version: '1.20'
description: Professional packet and movement anti-cheat with LuckPerms support
author: Helix
softdepend: [LuckPerms]
commands:
  ac:
    description: HelixAC admin commands (logs, ban, clear, wipe, staff logs, whitelist)
    usage: /ac <logs|staff|ban|ip|clear|wipe|whitelist|reload|info> ...
    aliases: [helixac, anticheat]
permissions:
  ac.bypass:
    description: Completely bypasses all HelixAC checks (no flags, no bans)
    default: false
  ac.whitelist:
    description: Player flags but is never auto-banned (permission whitelist)
    default: false
  ac.ban:
    description: Allows /ac ban and /ac ip ban
    default: op
  ac.clear:
    description: Allows /ac clear (clear player inventory)
    default: op
  ac.wipe:
    description: Allows /ac wipe (inventory, ender chest, stats)
    default: op
  ac.flags:
    description: See live flag alerts and flag entries in /ac logs
    default: op
  ac.logs:
    description: Access to HelixAC log commands (/ac logs, /ban logs, /ac staff logs)
    default: op
    children:
      ac.banlogs: true
      ac.stafflogs: true
  ac.banlogs:
    description: Access to /ac logs and /ban logs (ban history; flags need ac.flags)
    default: op
  ac.stafflogs:
    description: Access to /ac staff logs
    default: op
  ac.staff:
    description: Marks the player as staff for command logging
    default: op
  ac.notify:
    description: Receive ban/punishment broadcasts in chat
    default: op
  ac.admin:
    description: Full HelixAC access — includes every ac.* permission
    default: op
    children:
      ac.bypass: true
      ac.whitelist: true
      ac.ban: true
      ac.clear: true
      ac.wipe: true
      ac.flags: true
      ac.logs: true
      ac.banlogs: true
      ac.stafflogs: true
      ac.notify: true
      ac.staff: true
