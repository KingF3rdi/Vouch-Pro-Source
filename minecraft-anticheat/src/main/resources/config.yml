  combat-utility:
    enabled: true
    weight: 3
    max-vl: 10
    identical-streak: 5
    web-enemy-range: 4.5
    combat-window-ms: 2500
    web-water-ms: 900
  prestige-combat:
    enabled: true
    weight: 3
    max-vl: 12
    max-ping-exempt: 400
    swing-grace-ms: 400
    no-swing-streak: 5
    silent-aim-dot: 0.55
    silent-aim-min-distance: 1.8
    silent-aim-streak: 4
    snap-yaw: 40.0
    snap-max-pitch: 2.5
    snap-streak: 3
    multi-target-ms: 140
    multi-target-max-dot: 0.55
    multi-target-streak: 3
    click-samples: 12
    click-max-stddev: 3.5
    clicker-streak: 2
    payload-keywords:
      - "killaura"
      - "kill aura"
      - "aimassist"
      - "aim assist"
      - "triggerbot"
      - "autoblock"
      - "keepsprint"
      - "keep sprint"
      - "criticals"
      - "reach"
      - "hitbox"
      - "velocity"
      - "prestige"
      - "vape"
      - "shieldbreaker"
      - "shield breaker"
      - "cobweb"
      - "autoweb"
      - "autodrain"
      - "auto drain"
      - "webbreaker"
      - "fastplace"
      - "fast place"
      - "silentplace"
      - "silent place"
      - "scaffold"
  tick-abuse:
    enabled: true
    weight: 1
    max-vl: 20
    flag-balance-ms: 450
    max-balance-ms: 1200
    min-balance-ms: -800
    timer-streak: 8
    max-moves-per-second: 32
    max-actions-per-second: 28
    burst-streak: 5
    attack-desync-count: 12
    min-moves-with-attacks: 1
    max-ping-exempt: 450

messages:
  flag-notify: "%prefix%&e%player% &7flagged &c%check% &8(&7vl %vl%&8) &7— &f%detail%"
  banned-broadcast: "%prefix%&c%player% &7was banned for &c7 days &7— &f%reason%"
  manual-banned-broadcast: "%prefix%&c%player% &7was banned for &f%duration% &7— &f%reason%"
  ip-banned-broadcast: "%prefix%&c%player% &7was &cIP-banned &7for &f%duration% &7— &f%reason%"
  ban-success: "%prefix%&aBanned &f%player% &afor &f%duration%&a. Reason: &f%reason%"
  ban-success-ip: "%prefix%&aIP-banned &f%player% &afor &f%duration%&a. Reason: &f%reason%"
  whitelist-added: "%prefix%&aAdded &f%player% &ato the AC whitelist (flags only, no ban)."
  whitelist-removed: "%prefix%&cRemoved &f%player% &cfrom the AC whitelist."
  whitelist-list-header: "%prefix%&7Whitelisted players:"
  no-permission: "%prefix%&cYou do not have permission."
  player-not-found: "%prefix%&cPlayer not found: &f%player%"
  reload: "%prefix%&aConfiguration reloaded."
  meteor-detected: "%prefix%&c%player% &7blocked — &cMeteor Client &7(sign technique)"
  meteor-kick: "&cConnection blocked.\n&7Meteor Client is not allowed on this server."
  clear-success: "%prefix%&aCleared inventory of &f%player%&a."
  clear-notify: "%prefix%&cYour inventory was cleared by staff."
  wipe-success: "%prefix%&aWiped &f%player% &a(inventory, EC, XP, stats)."
  wipe-notify: "%prefix%&cYour inventory, ender chest, and stats were wiped by staff."
