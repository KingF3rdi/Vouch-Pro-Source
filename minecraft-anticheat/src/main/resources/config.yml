prefix: "&8[&aOakFFA AC&8]&r "

anti-indicators:
  enabled: true
  spoof-health: true
  spoof-armor: true
  use-max-as-fake: true
  fake-health: 20.0

setbacks:
  enabled: true

punishment:
  enabled: true
  flag-threshold: 25
  flag-decay-seconds: 600
  ban-duration-days: 7
  ban-reason: "Cheating (OakFFA Anti Cheat: %checks%)"
  ban-kick-message: "&cYou have been banned for 7 days.\n&7Reason: &fCheating\n&8Flags: %checks%"

storage:
  max-flag-logs: 200
  max-ban-logs: 100
  max-staff-logs: 300

checks:
  simulation:
    enabled: true
    weight: 2
    max-vl: 16
    offset-threshold: 0.55
    streak: 4
  invalid-packet:
    enabled: true
    weight: 3
    max-vl: 8
  invalid-input:
    enabled: true
    weight: 2
    max-vl: 10
    combo-streak: 5
    min-swap-ms: 40
  invalid-action:
    enabled: true
    weight: 3
    max-vl: 10
    reach-buffer: 0.35
    min-attack-dot: -0.15
    min-drop-ms: 35
  invalid-movement:
    enabled: true
    weight: 1
    max-vl: 12
    max-horizontal-speed: 1.55
    max-vertical-speed: 1.25
    max-teleport-distance: 80.0
  robotic-rotation:
    enabled: true
    weight: 2
    max-vl: 12
    identical-delta-streak: 8
    snap-min-yaw: 35.0
    snap-max-pitch-change: 0.01
    micro-step-samples: 14
    micro-step-tolerance: 0.0008
  bad-packets:
    enabled: true
    weight: 3
    max-vl: 6
  ghost-client:
    enabled: true
    weight: 5
    max-vl: 4
    suspicious-channels:
