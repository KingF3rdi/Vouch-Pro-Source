      - "vapeclient"
      - "prestige"
      - "prestigeclient"
      - "ghost"
      - "liquidbounce"
      - "wurst"
      - "aristois"
      - "meteor-client"
      - "impact"
    suspicious-brands:
      - "vape"
      - "vapeclient"
      - "prestige"
      - "prestigeclient"
      - "ghost"
      - "meteor"
  meteor-sign:
    enabled: true
    delay-ticks: 40
    timeout-ticks: 200
    ban-on-detect: false
  illegal-place:
    enabled: true
    weight: 2
    max-vl: 12
    max-ping-exempt: 400
    min-gap-ms: 45
    fast-streak: 5
    samples: 10
    max-mean-ms: 95.0
    max-stddev: 4.0
    regular-streak: 2
    silent-min-dot: 0.35
    silent-max-ray-miss: 1.35
